<!DOCTYPE html>
<html>
<head>
    <title>Editar Lead</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
  
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h1 class="mb-4">
                ✏️ Editar Lead
            </h1>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text"
                           name="name"
                           value="{{ lead.name }}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="text"
                           name="phone"
                           value="{{ lead.phone }}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email"
                           name="email"
                           value="{{ lead.email }}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Ciudad</label>
                    <input type="text"
                           name="city"
                           value="{{ lead.city }}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Origen</label>

                    <select name="source" class="form-select">

                        <option {% if lead.source == "Google Ads" %}selected{% endif %}>Google Ads</option>
                        <option {% if lead.source == "Cold Call" %}selected{% endif %}>Cold Call</option>
                        <option {% if lead.source == "Referral" %}selected{% endif %}>Referral</option>
                        <option {% if lead.source == "Facebook" %}selected{% endif %}>Facebook</option>

                    </select>

                </div>

                <div class="mb-3">
                    <label class="form-label">Estado</label>

                    <select name="status" class="form-select">

                        <option {% if lead.status == "NEW" %}selected{% endif %}>NEW</option>
                        <option {% if lead.status == "CONTACTED" %}selected{% endif %}>CONTACTED</option>
                        <option {% if lead.status == "INTERESTED" %}selected{% endif %}>INTERESTED</option>
                        <option {% if lead.status == "ONBOARDING" %}selected{% endif %}>ONBOARDING</option>
                        <option {% if lead.status == "ACTIVE" %}selected{% endif %}>ACTIVE</option>
                        <option {% if lead.status == "LOST" %}selected{% endif %}>LOST</option>

                    </select>

                </div>

                <div class="mb-3">
                    <label class="form-label">Notas</label>

                    <textarea name="notes"
                              class="form-control"
                              rows="4">{{ lead.notes }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar cambios
                </button>

        <a href="/leads" class="btn btn-outline-secondary">
            Cancelar
        </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
