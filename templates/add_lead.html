{% extends "base.html" %}

{% block title %}
Leads - Owner Acquisition CRM
{% endblock %}

{% block content %}


    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-body">

                <h1 class="mb-4">
                    <i class="bi bi-person-plus-fill"></i>
                    Nuevo Propietario
                </h1>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text"
                               name="name"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text"
                               name="phone"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email"
                               name="email"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Ciudad</label>
                        <input type="text"
                               name="city"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Origen</label>

                        <select name="source"
                                class="form-select">

                            <option>Google Ads</option>
                            <option>Cold Call</option>
                            <option>Referral</option>
                            <option>Facebook</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Estado</label>

                        <select name="status"
                                class="form-select">

                            <option>NEW</option>
                            <option>CONTACTED</option>
                            <option>INTERESTED</option>
                            <option>ONBOARDING</option>
                            <option>ACTIVE</option>
                            <option>LOST</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Notas</label>

                        <textarea name="notes"
                                  class="form-control"
                                  rows="4"></textarea>
                    </div>

                    <button type="submit"
                            class="btn btn-primary">
                        Guardar Lead
                    </button>

                    <a href="/"
                       class="btn btn-secondary">
                        Dashboard
                    </a>

                </form>

            </div>

        </div>

    </div>

{% endblock %}
